<!doctype html><html><head><meta name="robots" content="noindex,nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Advert Manager</title><link rel="stylesheet" href="styles.css?v=27.0.0"><style>.row{display:grid;grid-template-columns:1fr auto;gap:12px}.actions{display:flex;gap:6px;flex-wrap:wrap}.danger{background:#b91c1c!important;color:#fff!important}</style></head><body><header class="topbar"><div class="brand"><a href="index.html">Software Tools Marketplace</a><span>Advert administration</span></div><nav class="nav"><a href="admin-dashboard.html">Admin</a><a href="admin-finance.html">Finance</a><a href="marketplace.html">Public Marketplace</a></nav></header><main class="wrap"><section class="hero"><h1>Advert Manager</h1><p>Add, approve, edit, archive, restore or remove adverts. Financial history is never hard-deleted.</p></section><div class="box"><h2>Add Advert</h2><div class="formgrid"><input id="title" placeholder="Title"><select id="category"><option>Industrial Equipment</option><option>Electronics & Automation</option><option>Vehicles & Parts</option><option>Farm Equipment</option><option>Tools & Workshop</option><option>Professional Services</option><option>Home & Other</option></select><input id="price" type="number" placeholder="Price"><input id="town" placeholder="Town"><input id="province" placeholder="Province"><textarea id="description" placeholder="Description"></textarea></div><button class="btn" onclick="createAdvert()">Add and Publish</button></div><div class="box"><div class="row"><h2>All Adverts</h2><button class="btn secondary" onclick="loadAdverts()">Refresh</button></div><div id="list" class="grid"></div></div></main><script src="admin-listings.js?v=27.0.0"></script></body></html>
