<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Public Marketplace</title><link rel="stylesheet" href="styles.css?v=27.0.0"></head><body><header class="topbar"><div class="brand"><a href="index.html">Software Tools Marketplace</a><span>Public adverts from approved sellers</span></div><nav class="nav"><a href="products.html">Software</a><a class="active" href="marketplace.html">All Adverts</a><a href="seller-register.html">Register</a><a href="seller-listing-create.html">Place Advert</a></nav></header><main class="wrap"><section class="hero"><h1>Public Marketplace</h1><p>Anyone can browse approved adverts. Registration is only required to place and manage adverts.</p></section><div class="box"><div class="formgrid"><input id="q" placeholder="Search adverts"><select id="category"><option value="">All categories</option><option>Software & Digital Tools</option><option>Industrial Equipment</option><option>Electronics & Automation</option><option>Vehicles & Parts</option><option>Farm Equipment</option><option>Tools & Workshop</option><option>Professional Services</option><option>Home & Other</option></select><button class="btn" onclick="loadListings()">Search</button></div></div><div id="publicListings" class="grid"></div></main><footer class="footer"><a href="terms.html">Terms</a> · <a href="privacy.html">Privacy</a> · <a href="refund-policy.html">Refunds</a></footer><script>const e=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));async function loadListings(){const p=new URLSearchParams();if(q.value)p.set('q',q.value);if(category.value)p.set('category',category.value);const r=await fetch('/api/listings/public?'+p),rows=await r.json();publicListings.innerHTML=rows.length?rows.map(x=>`<article class="card">${x.coverImage?`<img class="prod-img" src="${e(x.coverImage)}" alt="">`:''}<h3>${e(x.title)}</h3><p>${e(x.town)} ${e(x.province)}</p><strong>R ${Number(x.price||0).toLocaleString('en-ZA')}</strong><p>${e((x.description||'').slice(0,150))}</p><a class="btn" href="listing.html?slug=${encodeURIComponent(x.slug)}">View Advert</a></article>`).join(''):'<div class="box"><h3>No approved adverts yet</h3><p>Approved adverts will appear here automatically.</p></div>'}loadListings();</script></body></html>
